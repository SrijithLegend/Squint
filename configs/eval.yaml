# FROZEN 2026-11-14. Severities tuned on DEV only (scripts/tune_severities.py; evidence in results/tuning/).
# Rule: level k = parameter at which FP32 dev mAP = (1-0.2k) of clean dev mAP. Do not change after test runs begin.
frozen: true
test_subset_size: 1000
count_threshold: 0.5
count_threshold_dev: 0.25   # argmin dev count-MAE, FP32 seed0 clean, 500 dev images (results/dev/); applied unchanged to all variants
corruptions:
  gaussian_blur:
  - sigma: 3.485
  - sigma: 5.582
  - sigma: 8.065
  - sigma: 11.724
  gaussian_noise:
  - sigma: 0.131
  - sigma: 0.213
  - sigma: 0.295
  - sigma: 0.412
  low_light:
  - brightness: 0.489
    gamma: 1.5
    peak: 60.0
    read_sigma: 0.01
  - brightness: 0.278
    gamma: 1.5
    peak: 60.0
    read_sigma: 0.01
  - brightness: 0.201
    gamma: 1.5
    peak: 60.0
    read_sigma: 0.01
  - brightness: 0.152
    gamma: 1.5
    peak: 60.0
    read_sigma: 0.01
  jpeg:
  - quality: 10
  - quality: 6
  - quality: 4
  - quality: 2
